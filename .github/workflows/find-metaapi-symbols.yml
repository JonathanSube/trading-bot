name: Find MetaApi Symbols

# Einmaliges Diagnose-Werkzeug (siehe scripts/find_metaapi_symbols.py),
# nicht Teil des automatisierten Signal-Bot-Takts - nur per Hand/API
# ausgeloest, kein Schedule. Ergebnis geht direkt ins Job-Log (kein
# Artefakt-Download noetig, siehe dump-channel-history.yml/
# trading-bot-spec.md zum frueheren Blockade-Workaround).
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  find-symbols:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: MetaApi-Symbole suchen
        env:
          METAAPI_TOKEN: ${{ secrets.METAAPI_TOKEN }}
          METAAPI_ACCOUNT_ID: ${{ secrets.METAAPI_ACCOUNT_ID }}
          METAAPI_REGION: ${{ secrets.METAAPI_REGION }}
        run: python scripts/find_metaapi_symbols.py
