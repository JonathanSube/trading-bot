name: Find cTrader Symbols

# Einmaliges Diagnose-Werkzeug (siehe scripts/find_ctrader_symbols.py),
# nicht Teil des automatisierten Signal-Bot-Takts - nur per Hand/API
# ausgeloest, kein Schedule.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  find-symbols:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Netzwerk-Diagnose (reines TCP, kein Twisted)
        run: |
          python -c "
          import socket, ssl
          try:
              s = socket.create_connection(('demo.ctraderapi.com', 5035), timeout=15)
              print('TCP-Verbindung OK')
              ctx = ssl.create_default_context()
              ss = ctx.wrap_socket(s, server_hostname='demo.ctraderapi.com')
              print('TLS-Handshake OK, Protokoll:', ss.version())
              ss.close()
          except Exception as e:
              print('FEHLGESCHLAGEN:', repr(e))
          "

      - name: cTrader-Symbole suchen
        env:
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          CTRADER_ACCESS_TOKEN_EXPIRES_AT: ${{ secrets.CTRADER_ACCESS_TOKEN_EXPIRES_AT }}
          # Fuer die automatische Aktualisierung von Refresh- und
          # Access-Token (siehe tradingbot/ctrader.py::_persist_secret) -
          # eigenes PAT noetig, GITHUB_TOKEN darf keine Secrets schreiben.
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
        run: python scripts/find_ctrader_symbols.py
