name: Signal Bot

on:
  schedule:
    # Fallback-Takt wie beim ORB-Bot (.github/workflows/trading-bot.yml) -
    # native GitHub-Schedules laufen unzuverlaessig nach (siehe
    # trading-bot-spec.md, Betriebsvorfaelle), Haupt-Auslöser ist der
    # externe cron-job.org-Trigger auf workflow_dispatch, idealerweise
    # dichter getaktet fuer zeitnahe Signalreaktion. Minuetlich, 06:00-21:59
    # UTC deckt alle vier Instrument-Sessions inkl. 5-Minuten-Vorlauf ab
    # (DAX/FTSE ab ~06:55 UTC im Sommer, NASDAQ/DOW ab ~13:25 UTC im Sommer,
    # bis zum US-Handelsschluss ~21:00 UTC im Winter) - siehe SESSIONS/
    # PRE_SESSION_LEAD_MINUTES in scripts/run_signal_bot.py, die das
    # tatsaechliche Ein-/Ausschalten pro Instrument und Lauf DST-sicher
    # entscheiden.
    - cron: "* 6-21 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: signal-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      # WICHTIG: ref: master explizit setzen (nicht den Default). Ohne das
      # checkt actions/checkout den Commit aus, der beim AUSLOESEN des Laufs
      # aktuell war - nicht den neuesten Stand beim tatsaechlichen Start.
      # Live beobachtet (02.09.2026): der externe Minuten-Trigger feuert
      # teils schneller als ein kompletter Lauf braucht (Checkout->Order->
      # Commit->Push, ca. 45-70s). Zwei kurz hintereinander ausgeloeste
      # Laeufe sahen dadurch BEIDE denselben (bereits veralteten) Stand OHNE
      # die vom jeweils anderen frisch eroeffnete Position, hielten ein
      # Kanal-Signal faelschlich fuer neu und platzierten unabhaengig
      # voneinander je eine ECHTE Order fuer dasselbe Signal (zwei reale
      # UK100-Positionen statt einer). ref: master zwingt den Checkout dazu,
      # den Branch-Namen frisch aufzuloesen (git fetch+checkout des
      # aktuellen HEAD), statt sich auf die beim Dispatch eingefrorene SHA
      # zu verlassen - behebt die Ursache, nicht nur das Symptom.
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Signal-Bot-Durchlauf
        env:
          # Pepperstone-Demokonto ueber die cTrader Open API statt Alpaca
          # seit dem Umstieg auf echte Index-CFDs (siehe trading-bot-spec.md,
          # Aenderungsprotokoll) - nach drei gescheiterten Broker-Anlaeufen
          # (OANDA, IG, MetaApi.cloud) die einzige gefundene Loesung, die
          # sowohl kostenlos ist als auch keine KYC-Huerde fuer ein
          # Demokonto verlangt. Der ORB-Bot-Workflow (trading-bot.yml,
          # separat) braucht weiterhin ALPACA_API_KEY/ALPACA_SECRET_KEY,
          # hier nicht mehr.
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
          # Zwischengespeicherter Access-Token samt Ablaufzeitpunkt (siehe
          # tradingbot/ctrader.py::get_access_token) - vermeidet einen
          # kompletten Token-Tausch bei JEDEM (minuetlichen!) Lauf, nur
          # wenn der zwischengespeicherte Token bereits abgelaufen ist.
          # Beide Secrets existieren zunaechst nicht und werden beim
          # ersten erfolgreichen Tausch automatisch angelegt.
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          CTRADER_ACCESS_TOKEN_EXPIRES_AT: ${{ secrets.CTRADER_ACCESS_TOKEN_EXPIRES_AT }}
          # cTrader rotiert den Refresh-Token bei jedem Tausch - eigenes PAT
          # noetig, damit der Bot CTRADER_REFRESH_TOKEN und die beiden
          # Access-Token-Secrets oben selbst aktuell halten kann (siehe
          # tradingbot/ctrader.py::_persist_secret, GITHUB_TOKEN darf keine
          # Actions-Secrets schreiben).
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_USER_SESSION: ${{ secrets.TELEGRAM_USER_SESSION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SIGNAL_CHANNEL: ${{ secrets.SIGNAL_CHANNEL }}
        # -u (unbuffered): ohne das puffert Python stdout komplett, wenn es
        # nicht an ein Terminal geht (wie hier) - alle print()-Zeilen
        # koennten dann erst am Prozessende in einem Rutsch geschrieben
        # werden und im Actions-Log denselben Zeitstempel tragen, obwohl
        # sie ueber Sekunden verteilt tatsaechlich passiert sind. Wichtig
        # fuer die Diagnose der [cTrader]-Verbindungs-Logs (siehe
        # tradingbot/ctrader.py).
        run: python -u scripts/run_signal_bot.py

      - name: Zustand und Protokoll zurückschreiben
        # if: always() ist entscheidend (02.09.2026 live beobachtet): ohne
        # das wird dieser Schritt komplett uebersprungen, sobald der
        # Python-Schritt oben mit einer unbehandelten Exception abstuerzt
        # (z.B. ein cTrader/Telegram-Timeout mitten im Lauf). main() in
        # scripts/run_signal_bot.py speichert den Zustand lokal per
        # save_state() auch im Fehlerfall, BEVOR es die Exception erneut
        # wirft - ohne always() wuerde dieser lokal gespeicherte Stand nie
        # committet/gepusht, sondern mit dem Runner-Workspace verworfen.
        # Bei einem Absturz kurz NACH einer echten Order waere das genau
        # der Mechanismus, der schon einmal (aus anderem Grund) zu einer
        # dem Bot unbekannten realen Position gefuehrt hat.
        if: always()
        run: |
          git config user.name "signal-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in signal_state.json signal_trades.csv signal_channel_log.csv; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet && exit 0
          git commit -m "Signal-Bot-Lauf $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Bei minuetlichem Takt kollidiert das haeufig mit dem parallel auf
          # master committenden ORB-Bot (trading-bot.yml) - "fetch first"-
          # Fehler, die ohne Retry den kompletten Zustand dieses Laufs
          # verwerfen (git push schlaegt fehl, der lokale Commit existiert
          # nur im verworfenen Runner-Workspace). Bei einer offenen Position
          # kann das dazu fuehren, dass der Bot sie "vergisst" und nie mehr
          # aktiv schliesst. Deshalb: bei Ablehnung neu holen, per Rebase
          # obendrauf setzen, erneut versuchen.
          #
          # BUGFIX (02.09.2026): hier stand vorher "-X ours" mit dem
          # Kommentar "die eigene State-Datei gewinnt bei Konflikt". Das war
          # falsch - bei `git rebase` ist die ours/theirs-Bedeutung genau
          # umgekehrt zu einem Merge: "ours" meint waehrend eines Rebase den
          # Branch, AUF DEN rebased wird (hier: origin/master, also der
          # FREMDE, bereits vorhandene Stand), "theirs" die eigenen,
          # gerade wiederaufgespielten Commits. Mit "-X ours" gewann also
          # bei einem echten Konflikt der AELTERE Fremd-Stand, und der
          # eigene, in diesem Lauf frisch geschriebene Zustand (z.B. eine
          # soeben real platzierte Order) wurde beim Push stillschweigend
          # verworfen - obwohl die Order laengst ausgefuehrt war. "-X
          # theirs" ist hier richtig: der eigene, aktuellere Lauf gewinnt.
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            echo "Push abgelehnt (Versuch $attempt), hole aktuellen Stand und versuche erneut..."
            git fetch origin master
            git rebase -X theirs origin/master
            sleep 2
          done
          echo "::error::Push nach 5 Versuchen weiterhin fehlgeschlagen - Zustand dieses Laufs wurde NICHT gesichert."
          exit 1
