name: Signal Bot

on:
  schedule:
    # Fallback-Takt wie beim ORB-Bot (.github/workflows/trading-bot.yml) -
    # native GitHub-Schedules laufen unzuverlaessig nach (siehe
    # trading-bot-spec.md, Betriebsvorfaelle), Haupt-Auslöser ist der
    # externe cron-job.org-Trigger auf workflow_dispatch, idealerweise
    # dichter getaktet fuer zeitnahe Signalreaktion.
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: signal-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Signal-Bot-Durchlauf
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SIGNAL_CHANNEL: ${{ secrets.SIGNAL_CHANNEL }}
        run: python scripts/run_signal_bot.py

      - name: Zustand und Protokoll zurückschreiben
        run: |
          git config user.name "signal-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in signal_state.json signal_trades.csv; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "Signal-Bot-Lauf $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
