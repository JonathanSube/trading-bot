name: Inspect Missing Messages

# Einmaliges Diagnose-Werkzeug (siehe scripts/inspect_missing_messages.py),
# Nutzer-Feedback 03.09.2026 ("Tom hat heute 11 Trades gemacht, der Bot
# aber nur 5") - prueft, ob Nachrichten ohne Text/Caption (reine Bilder)
# von fetch_new_messages() unsichtbar verschluckt werden. Nicht Teil des
# automatisierten Signal-Bot-Takts, nur per Hand ausgeloest.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Kanal-Rohverlauf pruefen
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_USER_SESSION: ${{ secrets.TELEGRAM_USER_SESSION }}
          SIGNAL_CHANNEL: ${{ secrets.SIGNAL_CHANNEL }}
        run: python scripts/inspect_missing_messages.py
